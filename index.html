<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bosch Research | CR/RIX3-AP</title>
    <meta
      name="description"
      content="Bosch Research CR/RIX3-AP team page for ADAS, VLA, perception, planning, and dependable V2X systems."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="images/favicon.ico" />
    <style>
      :root {
        --bg: #f3f3ef;
        --paper: #ffffff;
        --ink: #111111;
        --muted: #404040;
        --line: #111111;
        --accent: #d94c22;
        --accent-soft: #ffe5dc;
        --accent-2: #0d6b5f;
        --navy: #17346b;
        --stroke: 1.5px;
        --shadow: 4px 4px 0 #111111;
        --radius-xl: 0;
        --radius-lg: 0;
        --radius-md: 0;
        --max: 1180px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        scroll-behavior: smooth;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .grain {
        display: none;
      }

      .page {
        width: min(var(--max), calc(100% - 2rem));
        margin: 1.25rem auto 3rem;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
        padding: 0.85rem 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
        font-size: 0.96rem;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
        background: linear-gradient(130deg, var(--accent), #f3ae5b);
        display: grid;
        place-items: center;
        color: #fff;
        box-shadow: var(--shadow);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .nav a {
        padding: 0.45rem 0.8rem;
        border: var(--stroke) solid var(--line);
        color: var(--ink);
        background: #fff;
        font-size: 0.92rem;
        transition: transform 120ms ease;
      }

      .nav a:hover {
        transform: translate(-2px, -2px);
        box-shadow: 2px 2px 0 #111;
      }

      .hero {
        overflow: visible;
        margin-top: 4rem;
      }

      .hero-inner {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 1.8rem;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 0.7rem;
        padding: 0.3rem 0.7rem;
        border: var(--stroke) solid var(--line);
        font-size: 0.78rem;
        color: var(--ink);
        background: #fff;
        font-family: "Space Grotesk", monospace;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 0.8rem;
        font-size: clamp(1.8rem, 2.8vw, 3rem);
        line-height: 1.03;
        letter-spacing: -0.01em;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        max-width: 70ch;
        font-size: 1rem;
      }

      .hero-actions {
        margin-top: 1.2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border: var(--stroke) solid var(--line);
        font-weight: 600;
        font-size: 0.92rem;
        padding: 0.6rem 0.95rem;
        transition: transform 120ms ease;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease;
      }

      .btn-primary:hover {
        transform: translate(-2px, -2px);
        box-shadow: 2px 2px 0 #111;
      }

      .btn-secondary {
        border-color: var(--line);
        background: #fff;
        color: var(--ink);
      }

      .hero-card {
        display: grid;
        align-content: space-between;
        gap: 1rem;
      }

      .hero-card img {
        width: 100%;
        height: auto;
        object-fit: contain;
        background: #f8f8f8;
        border: var(--stroke) solid var(--line);
        padding: 0.7rem;
      }

      .section {
        margin-top: 4rem;
      }

      .section h2 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        margin-bottom: 0.8rem;
      }

      .section-sub {
        color: var(--muted);
        margin: 0;
        font-size: 0.95rem;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .pill {
        border: var(--stroke) solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 0.36rem 0.7rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: transform 120ms ease;
        font-family: "Space Grotesk", monospace;
      }

      .pill.active,
      .pill:hover {
        background: var(--accent);
        color: #fff;
        transform: translate(-2px, -2px);
        box-shadow: 2px 2px 0 #111;
      }

      .pub-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.9rem;
      }

      .pub-card {
        border: var(--stroke) solid var(--line);
        background: #fff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 100%;
        transition: transform 120ms ease;
      }

      .pub-media {
        aspect-ratio: 16 / 9;
        background: #efefef;
        overflow: hidden;
        border-bottom: var(--stroke) solid var(--line);
      }

      .pub-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .pub-body {
        padding: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        flex: 1;
      }

      .venue {
        font-size: 0.76rem;
        color: var(--accent-2);
        background: #dff4f0;
        width: fit-content;
        padding: 0.18rem 0.5rem;
        font-weight: 600;
        border: 1px solid #0d6b5f;
        font-family: "Space Grotesk", monospace;
      }

      .pub-title {
        margin: 0;
        font-size: 1.03rem;
        line-height: 1.26;
      }

      .pub-excerpt {
        margin: 0;
        color: #2e2e2e;
        font-size: 0.94rem;
        line-height: 1.4;
        flex: 1;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }

      .tag {
        font-size: 0.72rem;
        background: var(--accent-soft);
        color: #7a2408;
        padding: 0.18rem 0.4rem;
        border: 1px solid #eaa588;
        font-family: "Space Grotesk", monospace;
      }

      .pub-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-top: 0.2rem;
      }

      .mini-link {
        border: var(--stroke) solid var(--line);
        background: #fff;
        font-size: 0.8rem;
        padding: 0.3rem 0.55rem;
        color: var(--ink);
        transition: transform 120ms ease;
      }

      .mini-link:hover {
        transform: translate(-2px, -2px);
        box-shadow: 2px 2px 0 #111;
      }

      .partners-track {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 0.5rem;
      }

      .award-card {
        gap: 0.5rem;
        display: flex;
        flex-direction: row;
        padding-bottom: 5px;
      }

      .award-year {
        font-weight: 600;
        min-width: 100px;
      }

      .partner-card {
        border: var(--stroke) solid var(--line);
        background: #fff;
        padding: 0.55rem;
        display: grid;
        gap: 0.3rem;
        align-items: center;
        justify-items: center;
      }

      .partner-card img {
        width: 95px;
        height: 48px;
        object-fit: contain;
        filter: saturate(0.95) contrast(1.05);
      }

      .partner-card span {
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
      }

      .footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin: 4rem 0 0;
        padding-bottom: 0.8rem;
        font-family: "Space Grotesk", monospace;
      }

      @media (max-width: 1024px) {
        .hero-inner {
          grid-template-columns: 1fr;
        }

        .pub-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 740px) {
        .page {
          width: min(var(--max), calc(100% - 1rem));
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .hero-inner,
        .section {
          padding: 0.95rem;
        }

        .pub-grid {
          grid-template-columns: 1fr;
        }

        .section-head {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <div id="teamName">Bosch Research | CR/RIX3-AP</div>
        </div>
        <nav class="nav" aria-label="Primary Navigation">
          <a href="#publications">Publications</a>
          <a href="#awards">Awards</a>
          <a href="#partners">Partners</a>
        </nav>
      </header>

      <section class="hero" id="about">
        <div class="hero-inner">
          <div>
            <h1 id="tagline">Pioneering Autonomous Driving Intelligence</h1>
            <p id="aboutText"></p>
            <div class="hero-actions">
              <a class="btn btn-primary" href="#publications"
                >Explore Publications</a
              >
            </div>
          </div>
          <aside class="hero-card" aria-label="Team Snapshot">
            <img
              src="images/logos/CR_RIX3_logo.png"
              alt="CR/RIX3-AP team logo"
            />
          </aside>
        </div>
      </section>

      <section class="section" id="publications">
        <div class="section-head">
          <div>
            <h2>Publications</h2>
          </div>
          <div class="filters" id="filters"></div>
        </div>
        <div class="pub-grid" id="publicationGrid"></div>
      </section>

      <section class="section" id="awards">
        <div class="section-head">
          <div>
            <h2>Awards</h2>
          </div>
        </div>
        <div class="awards-grid" id="awardsGrid"></div>
      </section>

      <section class="section" id="partners">
        <div class="section-head">
          <div>
            <h2>Partners</h2>
          </div>
        </div>
        <div class="partners-wrap">
          <div class="partners-track" id="partnersTrack"></div>
        </div>
      </section>

      <p class="footer">Bosch Research | CR/RIX3-AP, All Rights Reserved.</p>
    </div>

    <script>
      const siteData = {
        team_name: "Bosch Research | CR/RIX3-AP",
        tagline:

        about:

        publications: [
          {

            img: "images/papers/2025_vtc_latency.png",
            excerpt:
              "A fine-grained latency monitoring and adaptive control framework for offloading AI functions over 5G networks. Improves real-time responsiveness and reliability for Vision-Language Models in connected vehicles through declarative QoS management.",
            tags: ["VLA & Generative AI", "V2X & Systems"],
            links: [
              {
                url: "https://events.vtsociety.org/vtc2025-fall/conference-sessions/in-person-program-schedule/",
                text: "Paper",
              },
            ],
          },
          {
            title:
              "Dependability-Aware Coordination for Infrastructure-Side Critical V2X Services",
            badge: "IEEE 102nd Vehicular Technology Conference (VTC2025-Fall)",
            img: "images/papers/2025_vtc_dependability.png",
            excerpt:
              "A Kubernetes-based coordination layer that brings automotive-grade dependability to roadside V2X services. Enables real-time monitoring, fault recovery, and workload reallocation for safety-critical applications.",
            tags: ["V2X & Systems"],
            links: [
              {
                url: "https://events.vtsociety.org/vtc2025-fall/conference-sessions/in-person-program-schedule/",
                text: "Paper",
              },
            ],
          },
          {
            title:
              "Towards Reliable Distributed Systems for Safety-Critical Vehicle-Road-Cloud Continuum",
            badge:
              "22nd EAI International Conference on Mobile and Ubiquitous Systems (MobiQuitous 2025)",
            img: "images/papers/2025_mobiquitous_reliable.png",
            excerpt:
              "A unified reliability framework for the vehicle-road-cloud continuum with dependability-aware coordination and latency-aware offloading across city-scale deployments.",
            tags: ["V2X & Systems"],
            links: [
              {
                url: "https://mobiquitous.eai-conferences.org/2025/accepted-papers/",
                text: "Paper",
              },
            ],
          },
          {
            title:
              "SparseMeXt: Unlocking the Potential of Sparse Representations for HD Map Construction",
            badge:
              "IEEE/RSJ International Conference on Intelligent Robots and Systems (2025)",
            img: "images/papers/2025_sparsemext.png",
            excerpt:
              "SparseMeXt is the first sparse paradigm to surpass dense methods in online HD map construction, setting a new benchmark.",
            tags: ["Perception & Planning"],
            links: [
              { url: "https://arxiv.org/pdf/2505.08808", text: "Paper" },
              { url: "https://SparseMeXT.github.io", text: "Project" },
              { url: "https://github.com/SparseMeXT/SparseMeXT", text: "Code" },
            ],
          },
          {
            title:
              "FlowDrive: Energy Flow Field for End-to-End Autonomous Driving",
            badge: "ArXiv",
            img: "images/papers/2025_flowdrive.png",
            excerpt:
              "FlowDrive introduces physically interpretable energy-based flow fields to encode semantic priors and safety cues into BEV space.",
            tags: ["Perception & Planning"],
            links: [
              { url: "https://arxiv.org/pdf/2509.14303", text: "Paper" },
              {
                url: "https://astrixdrive.github.io/FlowDrive.github.io/",
                text: "Project",
              },
              { url: "https://github.com/AstrixDrive/FlowDrive", text: "Code" },
            ],
          },
          {
            title:
              "IRL-VLA: Training an Vision-Language-Action Policy via Reward World Model",
            badge: "ArXiv",
            img: "images/papers/2025_irlvla.png",
            excerpt:
              "A close-loop reinforcement-learning method using an inverse-reward world model with a self-built VLA approach for autonomous driving.",
            tags: ["VLA & Generative AI", "Perception & Planning"],
            links: [
              { url: "https://arxiv.org/pdf/2508.06571", text: "Paper" },
              { url: "https://github.com/IRL-VLA/IRL-VLA", text: "Code" },
            ],
          },
          {
            title:
              "Impromptu VLA: Open Weights and Open Data for Driving Vision-Language-Action Models",
            badge: "NeurIPS 2025",
            img: "images/papers/2025_ivla.png",
            excerpt:
              "Impromptu VLA provides open weights and a dataset of 80,000 carefully curated clips distilled from over two million source clips.",
            tags: ["VLA & Generative AI", "Perception & Planning"],
            links: [
              { url: "https://arxiv.org/pdf/2505.23757", text: "Paper" },
              { url: "https://impromptu-vla.c7w.tech/", text: "Project" },
              { url: "https://github.com/ahydchh/Impromptu-VLA", text: "Code" },
            ],
          },
          {
            title:
              "DiffVLA: Vision-Language Guided Diffusion Planning for Autonomous Driving",
            badge: "2nd Place in Autonomous Grand E2E AD Challenge 2025",
            img: "images/papers/2025_diffvla.png",
            excerpt:
              "A hybrid sparse-dense diffusion policy empowered by a vision-language model, enabling efficient multi-modal driving behavior.",
            tags: ["VLA & Generative AI", "Perception & Planning"],
            links: [
              { url: "https://arxiv.org/pdf/2505.19381", text: "Paper" },
              { url: "https://diffvla.github.io/", text: "Project" },
              { url: "https://github.com/PeterJaq/DiffVLA", text: "Code" },
            ],
          },
          {
            title:
              "DASFO: Dependency-Aware Scalable Function Offloading Framework for Intelligent Connected Vehicles",
            badge:
              "22nd EAI International Conference on Mobile and Ubiquitous Systems (MobiQuitous 2025)",
            img: "images/papers/2025_mobiquitous_dasfo.png",
            excerpt:
              "A multi-stage offloading framework optimizing latency, energy, and cost under dynamic conditions using DRL and GCN-based dependency modeling.",
            tags: ["V2X & Systems"],
            links: [
              {
                url: "https://mobiquitous.eai-conferences.org/2025/accepted-papers/",
                text: "Paper",
              },
            ],
          },
        ],
        awards: [
          {
            name: "First Prize - Unicom Open Gateway Global Use Case Innovation Challenge 2025 - Autonomous Driving on Cloud",
            year: 2025,
          },
          {
            name: "2025年临空园区优秀科创项目奖 - 端到端自动驾驶项目",
            year: 2025,
          },
        ],
        partners: [
          {
            name: "The University of Hong Kong (HKU)",
            logo: "images/school_logos/HONGKONG.png",
          },
          { name: "Inria", logo: "images/school_logos/Inria.png" },
          { name: "MIT", logo: "images/school_logos/MIT_Social_circle.png" },
          {
            name: "Nanyang Technological University (NTU)",
            logo: "images/school_logos/NTU.png",
          },
          {
            name: "National University of Singapore (NUS)",
            logo: "images/school_logos/NUS.png",
          },
          {
            name: "Peking University (PKU)",
            logo: "images/school_logos/PKU_red.png",
          },
          {
            name: "Universite Paris-Saclay",
            logo: "images/school_logos/SACLAY.png",
          },
          {
            name: "Southeast University",
            logo: "images/school_logos/SOUTH.png",
          },
          {
            name: "The University of Tokyo",
            logo: "images/school_logos/TOKOYO.png",
          },
          { name: "Waseda University", logo: "images/school_logos/WASEDA.png" },
          { name: "University of Sydney", logo: "images/school_logos/de.png" },
          {
            name: "Telecom Paris / IP Paris",
            logo: "images/school_logos/paris.png",
          },
          {
            name: "The University of Queensland",
            logo: "images/school_logos/queensland.png",
          },
          { name: "Tsinghua University", logo: "images/school_logos/tsu.png" },
          {
            name: "Zhejiang University",
            logo: "images/school_logos/zhejiang.png",
          },
        ],
      };

      const teamNameEl = document.getElementById("teamName");
      const taglineEl = document.getElementById("tagline");
      const aboutEl = document.getElementById("aboutText");
      const publicationGrid = document.getElementById("publicationGrid");
      const filters = document.getElementById("filters");
      const partnersTrack = document.getElementById("partnersTrack");

      teamNameEl.textContent = siteData.team_name;
      taglineEl.textContent = siteData.tagline;
      aboutEl.textContent = siteData.about;

      const allTags = [
        "All",
        ...new Set(siteData.publications.flatMap((p) => p.tags || [])),
      ];
      let activeTag = "All";

      function makeLinkButton(link) {
        return `<a class="mini-link" href="${link.url}" target="_blank" rel="noopener noreferrer">${link.text}</a>`;
      }

      function renderPublications() {
        const filtered =
          activeTag === "All"
            ? siteData.publications
            : siteData.publications.filter((p) =>
                (p.tags || []).includes(activeTag),
              );

        publicationGrid.innerHTML = filtered
          .map(
            (pub) => `
				<article class="pub-card">
					<div class="pub-media">
						<img src="${pub.img}" alt="${pub.title}">
					</div>
					<div class="pub-body">
						<span class="venue">${pub.badge}</span>
						<h3 class="pub-title">${pub.title}</h3>
						<p class="pub-excerpt">${pub.excerpt}</p>
						<div class="tags">${(pub.tags || []).map((t) => `<span class="tag">${t}</span>`).join("")}</div>
						<div class="pub-links">${(pub.links || []).map(makeLinkButton).join("")}</div>
					</div>
				</article>
			`,
          )
          .join("");
      }

      function renderFilters() {
        filters.innerHTML = allTags
          .map(
            (tag) => `
				<button class="pill ${tag === activeTag ? "active" : ""}" type="button" data-tag="${tag}">${tag}</button>
			`,
          )
          .join("");

        filters.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeTag = btn.dataset.tag;
            renderFilters();
            renderPublications();
          });
        });
      }

      function renderAwards() {
        const cards = siteData.awards
          .map(
            (a) => `
				<div class="award-card">
          <div class="award-year">${a.year}</div>
					<div class="award-name">${a.name}</div>
				</div>
			`,
          )
          .join("");

        awardsGrid.innerHTML = cards;
      }

      function renderPartners() {
        const cards = siteData.partners
          .map(
            (p) => `
				<div class="partner-card">
					<img src="${p.logo}" alt="${p.name}">
					<span>${p.name}</span>
				</div>
			`,
          )
          .join("");

        partnersTrack.innerHTML = cards;
      }

      renderFilters();
      renderPublications();
      renderAwards();
      renderPartners();
    </script>
  </body>
</html>
