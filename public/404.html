<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      sessionStorage.setItem(
        "spa-redirect",
        location.pathname + location.search + location.hash,
      );
      location.replace("/");
    </script>
    <title>Redirecting</title>
  </head>
  <body></body>
</html>
